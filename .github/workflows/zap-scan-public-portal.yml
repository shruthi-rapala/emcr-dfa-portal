name: ZAP Scan Public Portal
permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches:
      - support-develop
    paths:
      - "dfa-public/**"
      - ".github/workflows/zap-scan-public-config.yml"
  schedule:
    # Bi-weekly scan at 6:15 AM UTC (1st and 15th of month)
    - cron: '15 6 1,15 * *'
  workflow_dispatch:

env:
  ZAP_TARGET_URL: 'https://publicsector-dev.dfa.gov.bc.ca'
  
jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: ZAP Security Scan - Public Portal
    timeout-minutes: 45
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup ZAP Configuration
        run: |
          echo "Preparing ZAP scan for Public Portal: ${{ env.ZAP_TARGET_URL }}"
          echo "Using rules file: .zap/rules-public.tsv"
          echo "Scan type: Enhanced baseline with form validation focus"
          
      - name: Run ZAP Baseline Scan
        run: |
          # Create report files with proper permissions
          touch report_html.html report_json.json results.sarif
          chmod 666 report_html.html report_json.json results.sarif
          
          # Run ZAP scan using Docker with proper volume permissions
          docker run --rm \
            -v $(pwd):/zap/wrk/:rw \
            --network=host \
            -t ghcr.io/zaproxy/zaproxy:stable \
            bash -c "
              zap-baseline.py \
                -t ${{ env.ZAP_TARGET_URL }} \
                -J /zap/wrk/report_json.json \
                -r /zap/wrk/report_html.html \
                -s /zap/wrk/results.sarif \
                -a -j -I -T 20 -D 5 \
                -c /zap/wrk/.zap/rules-public.tsv
            "
          
      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-public-portal-html-report
          path: report_html.html
          retention-days: 30
          
      - name: Upload ZAP JSON Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-public-portal-json-report
          path: report_json.json
          retention-days: 30
          
      - name: Upload SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: 'ZAP-DFA-Public-Portal-scan'
          
      - name: Security Scan Summary
        if: always()
        run: |
          echo "## ZAP Security Scan Results - Public Portal" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ env.ZAP_TARGET_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Type:** Enhanced Baseline (Form Validation Focus)" >> $GITHUB_STEP_SUMMARY
          echo "**Reports:** Available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
          if [ -f report_json.json ]; then
            echo "**Status:** Scan completed - Check SARIF results in Security tab" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⚠️ Scan may have encountered issues" >> $GITHUB_STEP_SUMMARY
          fi
