name: Trivy fs Security Scan

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches:
      - support-develop
  schedule:
    # Bi-weekly scan at 6:00 AM UTC (1st and 15th of month)
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

jobs:
  trivy_scan:
    runs-on: ubuntu-latest
    name: Trivy fs Security Scan
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-scan.sarif'
          
      - name: Run Trivy vulnerability scanner (JSON format)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-fs-scan.json'
          
      - name: Run Trivy vulnerability scanner (Table format)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-scan.txt'
          
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-scan.sarif'
          
      - name: Upload Trivy JSON Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-scan-json-report
          path: trivy-fs-scan.json
          retention-days: 30
          
      - name: Upload Trivy Table Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-scan-table-report
          path: trivy-fs-scan.txt
          retention-days: 30
          
      - name: Security Scan Summary
        if: always()
        run: |
          echo "## Trivy Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Type:** Filesystem vulnerability scan" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** Repository codebase and dependencies" >> $GITHUB_STEP_SUMMARY
          echo "**Reports:** Available in workflow artifacts and Security tab" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-fs-scan.json ]; then
            echo "**Status:** Scan completed - Reports available for download" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⚠️ Scan may have encountered issues" >> $GITHUB_STEP_SUMMARY
          fi