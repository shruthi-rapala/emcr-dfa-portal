name: ZAP Scan Private Portal
permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches:
      - support-develop
    paths:
      - "dfa/**"
      - ".github/workflows/zap-scan-private-config.yml"
  schedule:
    # Bi-weekly scan at 6:10 AM UTC (1st and 15th of month)
    - cron: '10 6 1,15 * *'
  workflow_dispatch:

env:
  ZAP_TARGET_URL: 'https://portal.dev.dfa.gov.bc.ca'
  
jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: ZAP Security Scan - Private Portal
    timeout-minutes: 45
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup ZAP Configuration
        run: |
          echo "Preparing ZAP scan for Private Portal: ${{ env.ZAP_TARGET_URL }}"
          echo "Using rules file: .zap/rules-private.tsv"
          echo "Scan type: Enhanced baseline with authentication focus"
          
      - name: Run ZAP Baseline Scan
        run: |
          # Create report files with proper permissions
          touch report_html.html report_json.json zap.yaml
          chmod 666 report_html.html report_json.json zap.yaml
          chmod 777 .
          
          # Run ZAP scan using Docker (continue on warnings)
          docker run --rm \
            -v $(pwd):/zap/wrk/:rw \
            --network=host \
            --workdir=/zap/wrk \
            -t ghcr.io/zaproxy/zaproxy:stable \
            bash -c "
              zap-baseline.py \
                -t ${{ env.ZAP_TARGET_URL }} \
                -J report_json.json \
                -r report_html.html \
                -a -j -I -T 20 -D 5 \
                -c .zap/rules-private.tsv \
                --autooff
            " || true

      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-private-portal-html-report
          path: report_html.html
          retention-days: 30
          
      - name: Upload ZAP JSON Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-private-portal-json-report
          path: report_json.json
          retention-days: 30
          
      - name: Security Scan Summary
        if: always()
        run: |
          echo "## ZAP Security Scan Results - Private Portal" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ env.ZAP_TARGET_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Type:** Enhanced Baseline (Authentication Focus)" >> $GITHUB_STEP_SUMMARY
          echo "**Reports:** Available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
          if [ -f report_json.json ]; then
            echo "**Status:** Scan completed - Reports available for download" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⚠️ Scan may have encountered issues" >> $GITHUB_STEP_SUMMARY
          fi