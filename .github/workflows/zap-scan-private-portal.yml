name: ZAP Scan Private Portal
permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches:
      - support-develop
    paths:
      - "dfa/**"
      - ".github/workflows/zap-scan-private-config.yml"
  schedule:
    # Bi-weekly scan at 6:10 AM UTC (1st and 15th of month)
    - cron: '10 6 1,15 * *'
  workflow_dispatch:

env:
  ZAP_TARGET_URL: 'https://portal.dev.dfa.gov.bc.ca'
  
jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: ZAP Security Scan - Private Portal
    timeout-minutes: 45
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup ZAP Configuration
        run: |
          echo "Preparing ZAP scan for Private Portal: ${{ env.ZAP_TARGET_URL }}"
          echo "Using rules file: .zap/rules-private.tsv"
          echo "Scan type: Enhanced baseline with authentication focus"
        
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.ZAP_TARGET_URL }}
          rules_file_name: '.zap/rules-private.tsv'
          cmd_options: '-a -j -I -T 20 -D 5'
          issue_title: 'ZAP Security Scan - Private Portal'
          fail_action: true
          allow_issue_writing: false
          
      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-private-portal-html-report
          path: report_html.html
          retention-days: 30
          
      - name: Upload ZAP JSON Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-private-portal-json-report
          path: report_json.json
          retention-days: 30
          
      - name: Upload SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: 'ZAP-Private-Portal'
          
      - name: Security Scan Summary
        if: always()
        run: |
          echo "## ZAP Security Scan Results - Private Portal" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ env.ZAP_TARGET_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Type:** Enhanced Baseline (Authentication Focus)" >> $GITHUB_STEP_SUMMARY
          echo "**Reports:** Available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
          if [ -f report_json.json ]; then
            echo "**Status:** Scan completed - Check SARIF results in Security tab" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⚠️ Scan may have encountered issues" >> $GITHUB_STEP_SUMMARY
          fi