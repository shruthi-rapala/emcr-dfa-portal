name: ZAP Scan Landing Page
permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches:
      - support-develop
    paths:
      - "landing-page/**"
      - ".github/workflows/zap-scan-landing-page.yml"
  schedule:
    # Bi-weekly scan at 6:05 AM UTC (1st and 15th of month)
    - cron: '5 6 1,15 * *'
  workflow_dispatch:

env:
  ZAP_TARGET_URL: 'https://dev.dfa.gov.bc.ca'
  
jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: ZAP Security Scan - Landing Page
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup ZAP Configuration
        run: |
          echo "Preparing ZAP scan for Landing Page: ${{ env.ZAP_TARGET_URL }}"
          echo "Using rules file: .zap/rules-landing.tsv"
          
      - name: Run ZAP Baseline Scan
        run: |
          # Create report files with proper permissions
          touch report_html.html report_json.json results.sarif zap.yaml
          chmod 666 report_html.html report_json.json results.sarif zap.yaml
          chmod 777 .
          
          # Run ZAP scan using Docker (continue on warnings)
          docker run --rm \
            -v $(pwd):/zap/wrk/:rw \
            --network=host \
            --workdir=/zap/wrk \
            -t ghcr.io/zaproxy/zaproxy:stable \
            bash -c "
              zap-baseline.py \
                -t ${{ env.ZAP_TARGET_URL }} \
                -J report_json.json \
                -r report_html.html \
                --sarif results.sarif \
                -a -j -I -T 15 \
                -c .zap/rules-landing.tsv \
                --autooff
            " || true

      - name: Check SARIF File
        if: always()
        run: |
          echo "Checking SARIF file..."
          ls -la results.sarif
          if [ -f results.sarif ]; then
            echo "SARIF file exists. Size: $(stat -f%z results.sarif) bytes"
            head -20 results.sarif
          else
            echo "SARIF file does not exist"
          fi
          
      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-landing-page-html-report
          path: report_html.html
          retention-days: 30
          
      - name: Upload ZAP JSON Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-landing-page-json-report
          path: report_json.json
          retention-days: 30
          
      - name: Upload SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('results.sarif') != '' && hashFiles('results.sarif') != 'da39a3ee5e6b4b0d3255bfef95601890afd80709'
        with:
          sarif_file: results.sarif
          category: 'ZAP-DFA-Landing-Page-scan'
          
      - name: Security Scan Summary
        if: always()
        run: |
          echo "## ZAP Security Scan Results - Landing Page" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ env.ZAP_TARGET_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Type:** Baseline Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "**Reports:** Available in workflow artifacts" >> $GITHUB_STEP_SUMMARY
          if [ -f report_json.json ]; then
            echo "**Status:** Scan completed - Check SARIF results in Security tab" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⚠️ Scan may have encountered issues" >> $GITHUB_STEP_SUMMARY
          fi