# ======================================================================================
#  Last Updated: 2026-01-14
#
#  Description:
#  Scheduled workflow to cleanup old Docker images from Artifactory.
#  - Deletes all _uploads/ folders
#  - Keeps only sha256 folders referenced in current manifest.json
#  - Deletes orphaned sha256 folders
#
#  Runs daily at 3 AM UTC.
# ======================================================================================

name: Cleanup Artifactory

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: "0 3 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would be deleted without deleting)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  ARTIFACTORY_URL: https://artifacts.developer.gov.bc.ca
  ARTIFACTORY_REPO: a6bec2-gen-docker-local
  # List of images to clean up
  IMAGES: "dfa-landing-page dfa-portal-api dfa-portal-api-public dfa-portal-pdf-service dfa-portal-ui dfa-portal-ui-public oauth-server"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        id: vars
        run: |
          echo "dry_run=${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_OUTPUT

      - name: Install JFrog CLI
        run: |
          curl -fL https://install-cli.jfrog.io | sh
          jf --version

      - name: Configure JFrog CLI
        run: |
          jf config add bcgov \
            --url="${{ env.ARTIFACTORY_URL }}" \
            --user="${{ secrets.ARTIFACTORY_USERNAME }}" \
            --password="${{ secrets.ARTIFACTORY_PASSWORD }}" \
            --interactive=false

      - name: Cleanup old artifacts
        id: cleanup
        run: |
          DRY_RUN=${{ steps.vars.outputs.dry_run }}
          DELETED_COUNT=0
          UPLOADS_DELETED=0

          echo "=== Cleanup Configuration ==="
          echo "Dry Run: $DRY_RUN"
          echo ""

          for IMAGE in ${{ env.IMAGES }}; do
            echo "=========================================="
            echo "Processing: $IMAGE"
            echo "=========================================="

            # -----------------------------------------
            # Step 1: Delete _uploads folder
            # -----------------------------------------
            echo ""
            echo "--- Step 1: Cleaning _uploads ---"

            UPLOADS_SEARCH=$(jf rt search "${{ env.ARTIFACTORY_REPO }}/$IMAGE/_uploads/*" 2>/dev/null | sed -n '/^\[/,/^\]/p' | jq -r '.[].path' 2>/dev/null || echo "")

            if [ -n "$UPLOADS_SEARCH" ]; then
              UPLOAD_COUNT=$(echo "$UPLOADS_SEARCH" | grep -c . || echo "0")
              echo "Found $UPLOAD_COUNT files in _uploads"

              if [ "$DRY_RUN" == "true" ]; then
                echo "[DRY RUN] Would delete: ${{ env.ARTIFACTORY_REPO }}/$IMAGE/_uploads/"
              else
                echo "Deleting: ${{ env.ARTIFACTORY_REPO }}/$IMAGE/_uploads/"
                jf rt del "${{ env.ARTIFACTORY_REPO }}/$IMAGE/_uploads/" --quiet || true
                UPLOADS_DELETED=$((UPLOADS_DELETED + 1))
              fi
            else
              echo "No _uploads folder found"
            fi

            # -----------------------------------------
            # Step 2: Get current manifest references
            # -----------------------------------------
            echo ""
            echo "--- Step 2: Reading current manifest ---"

            # Download the latest manifest.json
            MANIFEST_CONTENT=$(jf rt curl -XGET "/api/storage/${{ env.ARTIFACTORY_REPO }}/$IMAGE/latest/manifest.json" 2>/dev/null || echo "")

            if [ -z "$MANIFEST_CONTENT" ]; then
              echo "No manifest.json found for $IMAGE/latest, skipping..."
              echo ""
              continue
            fi

            # Download actual manifest to get referenced digests
            TEMP_MANIFEST=$(mktemp)
            jf rt download "${{ env.ARTIFACTORY_REPO }}/$IMAGE/latest/manifest.json" "$TEMP_MANIFEST" --flat 2>/dev/null || true

            # Extract all sha256 references from manifest (handles both manifest and manifest list)
            REFERENCED_SHAS=$(cat "$TEMP_MANIFEST" 2>/dev/null | grep -oE 'sha256:[a-f0-9]{64}' | sort -u || echo "")
            rm -f "$TEMP_MANIFEST"

            if [ -z "$REFERENCED_SHAS" ]; then
              echo "Could not extract sha256 references from manifest"
              echo ""
              continue
            fi

            REF_COUNT=$(echo "$REFERENCED_SHAS" | grep -c . || echo "0")
            echo "Found $REF_COUNT referenced sha256 digests in manifest:"
            echo "$REFERENCED_SHAS" | head -5
            [ "$REF_COUNT" -gt 5 ] && echo "... and $((REF_COUNT - 5)) more"

            # -----------------------------------------
            # Step 3: Find all sha256 entries under latest/
            # -----------------------------------------
            echo ""
            echo "--- Step 3: Finding all sha256 entries ---"

            TEMP_FILE=$(mktemp)
            # Search for all items under latest/ to find sha256 entries
            jf rt search "${{ env.ARTIFACTORY_REPO }}/$IMAGE/latest/" > "$TEMP_FILE" 2>&1 || true

            # Extract unique sha256 identifiers from paths (handles both sha256: and sha256__ formats)
            ALL_SHA_PATHS=$(sed -n '/^\[/,/^\]/p' "$TEMP_FILE" | jq -r '.[].path' 2>/dev/null | grep -oE 'sha256[:_][_]?[a-f0-9]{64}' | sed 's/sha256__/sha256:/g' | sed 's/sha256_/sha256:/g' | sort -u || echo "")
            rm -f "$TEMP_FILE"

            if [ -z "$ALL_SHA_PATHS" ]; then
              echo "No sha256 folders found"
              echo ""
              continue
            fi

            ALL_COUNT=$(echo "$ALL_SHA_PATHS" | grep -c . || echo "0")
            echo "Found $ALL_COUNT sha256 folders in repository"

            # -----------------------------------------
            # Step 4: Delete orphaned sha256 folders
            # -----------------------------------------
            echo ""
            echo "--- Step 4: Deleting orphaned sha256 folders ---"

            ORPHAN_COUNT=0
            while IFS= read -r SHA; do
              [ -z "$SHA" ] && continue

              # Check if this sha256 is referenced in manifest
              if echo "$REFERENCED_SHAS" | grep -q "$SHA"; then
                echo "KEEP: $SHA (referenced in manifest)"
              else
                ORPHAN_COUNT=$((ORPHAN_COUNT + 1))
                if [ "$DRY_RUN" == "true" ]; then
                  echo "[DRY RUN] Would delete: ${{ env.ARTIFACTORY_REPO }}/$IMAGE/latest/$SHA/"
                else
                  echo "DELETE: $SHA (orphaned)"
                  jf rt del "${{ env.ARTIFACTORY_REPO }}/$IMAGE/latest/$SHA/" --quiet || true
                  DELETED_COUNT=$((DELETED_COUNT + 1))
                fi
              fi
            done <<< "$ALL_SHA_PATHS"

            echo ""
            echo "Summary for $IMAGE: $ORPHAN_COUNT orphaned sha256 folders"
            echo ""
          done

          echo "deleted_count=$DELETED_COUNT" >> $GITHUB_OUTPUT
          echo "uploads_deleted=$UPLOADS_DELETED" >> $GITHUB_OUTPUT
          echo ""
          echo "=========================================="
          echo "TOTAL: Deleted $DELETED_COUNT sha256 folders, $UPLOADS_DELETED _uploads folders"
          echo "=========================================="

      - name: Summary
        run: |
          echo "## Artifactory Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: ${{ env.ARTIFACTORY_REPO }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ steps.vars.outputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Images Processed**: ${{ env.IMAGES }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256 Folders Deleted**: ${{ steps.cleanup.outputs.deleted_count || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Upload Folders Deleted**: ${{ steps.cleanup.outputs.uploads_deleted || '0' }}" >> $GITHUB_STEP_SUMMARY
