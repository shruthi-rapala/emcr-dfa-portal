<div formGroupName="step2">
  <div class="row">
    <div class="col-md-8">
      <app-dfa-attachment 
        isAppeal=true
        isDisabled="isDisabled" 
        requiredDocumentType="null" 
        title="Add Supporting Documents(Optional)"
        description="If applicable, you may include additional documents related to your Appeal."
        [allowedFileTypes]="allowedFileTypes"
        allowedFileExtensionsList=".pdf, .doc, .docx, .png, .jpeg, .jpg, .ppt, .pptx, .xls, .xlsx"
        excludeFileTypes="['Identification', 'Unknown']"
        (saveFileUpload)="saveSupportingFiles($event)"
        (cancelFileUpload)="cancelSupportingFiles()"
        [fileUploadsForm]="fileUploadsProjectAppealForm"     
        >     
      </app-dfa-attachment>
      <app-loader
          class="spinner"
          [showLoader]="isLoading"
          strokeWidth="10"
          diameter="50"
        >
        </app-loader>
    </div>
  </div>

  <div *ngIf="projectAppealDocumentSummaryDataSource.data.length > 0">
    <br />
    <p class="sub-heading" style="font-size: 15px">Document Summary</p>
  </div>

  <table mat-table [dataSource]="projectAppealDocumentSummaryDataSource"
  *ngIf="projectAppealDocumentSummaryDataSource.data.length > 0" style="width:100%">
  <!-- File Name Column -->
  <ng-container matColumnDef="fileName" style="width:25%">
    <th mat-header-cell *matHeaderCellDef>
      <b>File Name</b>
    </th>
    <td *matCellDef="let element" mat-cell>
      {{ element.fileName }}
    </td>
  </ng-container>

  <!-- Description Column -->
  <ng-container matColumnDef="fileDescription" style="width:25%">
    <th mat-header-cell *matHeaderCellDef>
      <b>File Description</b>
    </th>
    <td *matCellDef="let element" mat-cell>
      {{ element.fileDescription}}
    </td>
  </ng-container>

  <!-- Category Column -->
  <ng-container matColumnDef="fileTypeText" style="width:25%">
    <th mat-header-cell *matHeaderCellDef>
      <b>Category</b>
    </th>
    <td *matCellDef="let element" mat-cell>
      {{ element.fileTypeText }}
    </td>
  </ng-container>

  <!-- UploadedDate Column -->
  <ng-container matColumnDef="uploadedDate" style="width:25%">
    <th mat-header-cell *matHeaderCellDef>
      <b>Date Uploaded</b>
    </th>
    <td *matCellDef="let element" mat-cell>
      {{ element.uploadedDate | date:"dd-MMM-yyyy" }}
    </td>
  </ng-container>

  <!-- Delete Icon Column -->
  <ng-container matColumnDef="icons" style="width:25%" >
    <th mat-header-cell *matHeaderCellDef>
      &nbsp;
    </th>
    <td *matCellDef="let element; let index = index" mat-cell>
      <button *ngIf="vieworedit !== 'view'" class="delete-image" mat-icon-button aria-label="Remove"
        (click)="confirmDeleteDocumentSummaryRow(element)">
        <img src="/assets/images/delete.svg" height="35" width="35" />
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="projectAppealDocumentSummaryColumnsToDisplay"></tr>
  <tr mat-row *matRowDef="let element; columns: projectAppealDocumentSummaryColumnsToDisplay" class="example-element-row"
    [style.height]="'auto'"></tr>

</table>
</div>
